<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Görev Merkezi</title>
<meta name="theme-color" content="#0E1B2C" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: #EEF2F5;
    color: #0E1B2C;
    font-family: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
  }
  button { font-family: inherit; cursor: pointer; }
  input, select, textarea { font-family: inherit; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 2px solid #0E7C66; outline-offset: 2px;
  }

  /* ---- giriş ekranı ---- */
  .giris-sayfa {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 20px; background: #0E1B2C;
  }
  .giris-kart {
    background: #fff; border-radius: 20px; padding: 32px 28px;
    width: 100%; max-width: 400px;
  }
  .giris-eyebrow {
    font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
    color: #0E7C66; font-weight: 700; margin-bottom: 6px;
  }
  .giris-baslik { margin: 0 0 4px; font-size: 24px; font-weight: 800; letter-spacing: -.02em; }
  .giris-alt { color: #64748B; font-size: 14px; margin-bottom: 22px; }
  .form-etiket {
    display: block; font-size: 12.5px; font-weight: 700; color: #475569;
    margin: 14px 0 6px; text-transform: uppercase; letter-spacing: .06em;
  }
  .girdi {
    width: 100%; border: 1px solid #CBD5E1; border-radius: 10px;
    padding: 11px 12px; font-size: 15px; background: #F8FAFC; color: #0E1B2C;
  }
  .btn-ana {
    border: none; background: #0E7C66; color: #fff; padding: 12px 18px;
    border-radius: 10px; font-size: 15px; font-weight: 700; width: 100%; margin-top: 20px;
  }
  .btn-ana:disabled { opacity: .6; cursor: default; }
  .btn-link {
    border: none; background: transparent; color: #0E7C66;
    font-size: 13.5px; font-weight: 700; padding: 6px; margin-top: 12px; width: 100%;
  }
  .hata-kutu {
    background: #FEE2E2; color: #B91C1C; font-size: 13px; font-weight: 600;
    border-radius: 8px; padding: 8px 12px; margin-top: 12px;
  }
  .bilgi-kutu {
    background: #D1FAE5; color: #065F46; font-size: 13px; font-weight: 600;
    border-radius: 8px; padding: 8px 12px; margin-top: 12px;
  }

  /* ---- uygulama ---- */
  .gizli { display: none !important; }
  .app { min-height: 100vh; padding-bottom: 90px; }
  header.ust {
    background: #0E1B2C; color: #fff; padding: 20px 16px 22px;
  }
  .ust-ic {
    max-width: 860px; margin: 0 auto; display: flex;
    justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap;
  }
  .eyebrow {
    font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
    color: #7FD1BE; font-weight: 700; margin-bottom: 4px;
  }
  h1.baslik { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
  .ust-sag { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .rozet { font-size: 12px; font-weight: 600; }
  .r-yesil { color: #34D399; } .r-sari { color: #FBBF24; } .r-kirmizi { color: #F87171; }
  .cikis-btn {
    border: 1px solid rgba(255,255,255,.25); background: transparent; color: #C6D2DE;
    padding: 7px 13px; border-radius: 9px; font-size: 12.5px; font-weight: 700;
  }
  .sekmeler {
    display: flex; background: rgba(255,255,255,.08); border-radius: 10px; padding: 4px; gap: 4px;
  }
  .sekme-btn {
    border: none; background: transparent; color: #C6D2DE; padding: 8px 16px;
    border-radius: 8px; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px;
  }
  .sekme-btn.aktif { background: #fff; color: #0E1B2C; }
  .sayac-mini {
    background: #0E7C66; color: #fff; border-radius: 999px;
    font-size: 11px; padding: 1px 7px; font-weight: 700;
  }
  .icerik { max-width: 860px; margin: 0 auto; padding: 20px 16px; }

  .arac { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .filtre-grup { display: flex; background: #fff; border: 1px solid #E2E8F0; border-radius: 10px; padding: 4px; gap: 4px; }
  .filtre-btn {
    border: none; background: transparent; padding: 7px 14px; border-radius: 7px;
    font-size: 13.5px; font-weight: 600; color: #64748B;
  }
  .filtre-btn.aktif { background: #0E1B2C; color: #fff; }
  .yeni-btn {
    border: none; background: #0E7C66; color: #fff; padding: 10px 18px;
    border-radius: 10px; font-size: 14px; font-weight: 700;
  }
  .kat-satir { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
  .kat-chip {
    display: flex; align-items: center; gap: 6px; border: 1px solid #E2E8F0;
    background: #fff; color: #334155; padding: 6px 12px; border-radius: 999px;
    font-size: 13px; font-weight: 600;
  }
  .kat-chip.tumu-aktif { background: #0E1B2C; border-color: #0E1B2C; color: #fff; }
  .nokta { width: 8px; height: 8px; border-radius: 999px; display: inline-block; }

  ul.liste { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
  .kart {
    display: flex; gap: 12px; align-items: flex-start; background: #fff;
    border: 1px solid #E2E8F0; border-radius: 14px; padding: 14px;
    transition: box-shadow .15s ease;
  }
  .kart:hover { box-shadow: 0 4px 14px rgba(14,27,44,.08); }
  .kart.tamam { opacity: .55; }
  .kart.gecikti { border-color: #FCA5A5; border-left: 4px solid #DC2626; background: #FFF7F7; }
  .kutu {
    width: 24px; height: 24px; min-width: 24px; border-radius: 8px;
    border: 2px solid #CBD5E1; background: #fff; display: flex;
    align-items: center; justify-content: center; margin-top: 2px; padding: 0;
    color: #fff; font-size: 13px;
  }
  .kutu.isaretli { background: #0E7C66; border-color: #0E7C66; }
  .kart-govde { flex: 1; min-width: 0; }
  .kart-baslik { font-size: 15.5px; font-weight: 700; word-break: break-word; }
  .kart-baslik.ustu-cizili { text-decoration: line-through; }
  .unlem {
    display: inline-flex; align-items: center; justify-content: center;
    width: 18px; height: 18px; border-radius: 999px; background: #DC2626;
    color: #fff; font-size: 12px; font-weight: 800; margin-right: 7px; vertical-align: text-bottom;
  }
  .gecikme-uyari {
    margin-top: 6px; background: #FEE2E2; color: #B91C1C; font-size: 12.5px;
    font-weight: 700; border-radius: 8px; padding: 5px 10px; display: inline-block;
  }
  .kart-not { font-size: 13.5px; color: #64748B; margin-top: 3px; word-break: break-word; }
  .kart-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .etiket {
    font-size: 12px; font-weight: 600; border: 1px solid #CBD5E1; border-radius: 999px;
    padding: 2px 9px; background: #fff; color: #64748B;
  }
  .kart-aksiyon { display: flex; gap: 4px; }
  .ikon-btn { border: none; background: transparent; font-size: 15px; color: #94A3B8; padding: 6px; border-radius: 8px; }

  .bos {
    text-align: center; padding: 56px 20px; background: #fff;
    border: 1px dashed #CBD5E1; border-radius: 16px;
  }
  .bos-ikon { font-size: 40px; margin-bottom: 10px; }
  .bos-baslik { font-weight: 600; margin-bottom: 4px; }
  .bos-alt { color: #64748B; font-size: 14px; }

  /* rapor */
  .rapor-ust { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
  .halka-kart {
    background: #fff; border: 1px solid #E2E8F0; border-radius: 16px; padding: 16px;
    display: flex; align-items: center; justify-content: center; flex: 0 0 auto;
  }
  .stat-grup {
    flex: 1; min-width: 240px; display: grid;
    grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px;
  }
  .stat-kart {
    background: #fff; border: 1px solid #E2E8F0; border-radius: 14px; padding: 16px 14px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .stat-deger { font-size: 28px; font-weight: 800; letter-spacing: -.02em; }
  .stat-ad { font-size: 12.5px; color: #64748B; font-weight: 600; margin-top: 2px; }
  .panel { background: #fff; border: 1px solid #E2E8F0; border-radius: 16px; padding: 18px; margin-bottom: 14px; }
  .panel-baslik { display: flex; justify-content: space-between; align-items: baseline; font-size: 15px; font-weight: 800; margin-bottom: 14px; }
  .panel-alt { color: #64748B; font-weight: 500; font-size: 13px; }
  .periyot-satir {
    display: flex; gap: 6px; margin-bottom: 14px; background: #EEF2F5;
    border-radius: 10px; padding: 4px; width: fit-content; max-width: 100%; flex-wrap: wrap;
  }
  .periyot-btn { border: none; background: transparent; padding: 7px 14px; border-radius: 7px; font-size: 13.5px; font-weight: 600; color: #64748B; }
  .periyot-btn.aktif { background: #0E1B2C; color: #fff; }
  .cubuk-alan { display: flex; gap: 8px; align-items: flex-end; height: 140px; }
  .cubuk-kolon { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; }
  .cubuk-deger { font-size: 12px; font-weight: 700; color: #0E7C66; margin-bottom: 4px; min-height: 16px; }
  .cubuk { width: 100%; max-width: 42px; border-radius: 8px 8px 3px 3px; background: #94B8AF; transition: height .4s ease; }
  .cubuk.son { background: #0E7C66; }
  .cubuk-ad { font-size: 11.5px; color: #64748B; margin-top: 6px; font-weight: 600; }
  .cubuk-ad.kucuk { font-size: 10px; }
  /* takvim */
  .takvim-ust { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .takvim-baslik-yazi { font-size: 16px; font-weight: 800; }
  .takvim-nav { border: 1px solid #E2E8F0; background: #fff; width: 36px; height: 36px; border-radius: 9px; font-size: 18px; color: #334155; }
  .takvim-hafta { display: grid; grid-template-columns: repeat(7,1fr); gap: 4px; margin-bottom: 4px; }
  .takvim-hafta div { text-align: center; font-size: 11px; font-weight: 700; color: #64748B; text-transform: uppercase; padding: 4px 0; }
  .takvim-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 4px; }
  .takvim-gun { border: 1px solid transparent; background: transparent; border-radius: 10px; min-height: 54px; padding: 5px 2px 4px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 13px; font-weight: 600; color: #334155; }
  .takvim-gun:hover { background: #EEF2F5; }
  .takvim-gun.baska-ay { color: #CBD5E1; }
  .takvim-gun.bugun { border-color: #0E7C66; color: #0E7C66; font-weight: 800; }
  .takvim-gun.secili { background: #0E1B2C; color: #fff; }
  .takvim-noktalar { display: flex; gap: 2px; flex-wrap: wrap; justify-content: center; align-items: center; }
  .takvim-noktalar .nokta { width: 6px; height: 6px; }
  .takvim-gun .fazla { font-size: 9px; font-weight: 800; color: #64748B; }
  .takvim-gun.secili .fazla { color: #C6D2DE; }

  /* bildirim merkezi */
  .rozet-sayi { background: #DC2626; color: #fff; border-radius: 999px; font-size: 11px; padding: 1px 7px; font-weight: 800; }
  .bildirim-kart { display: flex; gap: 12px; align-items: flex-start; background: #fff; border: 1px solid #E2E8F0; border-left: 4px solid #CBD5E1; border-radius: 14px; padding: 14px; margin-bottom: 10px; }
  .bildirim-ikon { font-size: 20px; line-height: 1; margin-top: 2px; }
  .bildirim-baslik { font-weight: 700; font-size: 14.5px; word-break: break-word; }
  .bildirim-alt { color: #64748B; font-size: 13px; margin-top: 2px; }
  .bildirim-izin-yazi { font-size: 14px; color: #334155; line-height: 1.5; }
  .banner { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); background: #0E1B2C; color: #fff; padding: 14px 18px; border-radius: 14px; z-index: 100; box-shadow: 0 10px 30px rgba(14,27,44,.35); display: flex; gap: 12px; align-items: center; max-width: 92vw; }
  .banner b { color: #7FD1BE; }
  .banner button { border: none; background: rgba(255,255,255,.15); color: #fff; border-radius: 8px; padding: 6px 12px; font-weight: 700; }
  @media (max-width: 720px) { .alt-btn { padding: 8px 7px; font-size: 12px; } }

  /* ajanda */
  .ajanda-ust { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .ajanda-tarih-sec { display: flex; align-items: center; gap: 8px; }
  .ajanda-gun-baslik { font-size: 17px; font-weight: 800; }
  .ajanda-gun-alt { font-size: 12.5px; color: #64748B; font-weight: 600; }
  .not-yaz-alan { display: flex; flex-direction: column; gap: 10px; }
  .not-girdi { width: 100%; border: 1px solid #CBD5E1; border-radius: 12px; padding: 12px 14px; font-size: 15px; background: #F8FAFC; color: #0E1B2C; min-height: 90px; resize: vertical; line-height: 1.5; font-family: inherit; }
  .not-kart { background: #FFFBEB; border: 1px solid #FDE68A; border-left: 4px solid #F59E0B; border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; }
  .not-kart.bilgi { background: #fff; border-color: #E2E8F0; border-left-color: #4C6FFF; }
  .not-metin { font-size: 14.5px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; color: #1E293B; }
  .not-alt-satir { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; gap: 8px; }
  .not-saat { font-size: 12.5px; color: #64748B; font-weight: 600; }
  .not-aksiyon { display: flex; gap: 4px; }
  .ozet-satir { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .ozet-kutu { flex: 1; min-width: 100px; background: #fff; border: 1px solid #E2E8F0; border-radius: 12px; padding: 12px 14px; }
  .ozet-deger { font-size: 22px; font-weight: 800; }
  .ozet-ad { font-size: 12px; color: #64748B; font-weight: 600; margin-top: 2px; }
  .takvim-not-im { font-size: 9px; line-height: 1; }

  .kat-rapor-satir { display: flex; justify-content: space-between; margin-bottom: 6px; }
  .kat-rapor-ad { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
  .kat-rapor-sayi { font-size: 13px; color: #64748B; }
  .ilerle-arka { height: 8px; background: #EEF2F5; border-radius: 999px; overflow: hidden; margin-bottom: 14px; }
  .ilerle-dolgu { height: 100%; border-radius: 999px; transition: width .5s ease; }

  /* mobil alt bar */
  .alt-bar {
    position: fixed; bottom: 0; left: 0; right: 0; background: #0E1B2C;
    display: flex; justify-content: space-around; align-items: center;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); z-index: 40;
  }
  .alt-btn { border: none; background: transparent; color: #94A3B8; font-size: 13.5px; font-weight: 700; padding: 8px 14px; border-radius: 10px; }
  .alt-btn.aktif { color: #fff; background: rgba(255,255,255,.1); }
  .fab {
    border: none; background: #0E7C66; color: #fff; width: 52px; height: 52px;
    border-radius: 18px; font-size: 26px; font-weight: 700; line-height: 1;
    box-shadow: 0 6px 18px rgba(14,124,102,.45); margin-top: -30px;
  }

  /* modal */
  .perde {
    position: fixed; inset: 0; background: rgba(14,27,44,.5);
    display: flex; align-items: flex-end; justify-content: center; z-index: 60;
  }
  .modal {
    background: #fff; border-radius: 20px 20px 0 0; width: 100%; max-width: 520px;
    padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
    max-height: 90vh; overflow-y: auto;
  }
  .modal-baslik { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .modal-baslik h2 { margin: 0; font-size: 18px; font-weight: 800; }
  .form-satir { display: flex; gap: 12px; }
  .form-satir > div { flex: 1; }
  .hata-yazi { color: #DC2626; font-size: 13px; font-weight: 600; margin-top: 6px; }
  .modal-alt { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }
  .iptal-btn {
    border: 1px solid #CBD5E1; background: #fff; color: #334155;
    padding: 10px 18px; border-radius: 10px; font-size: 14px; font-weight: 700;
  }
  .kaydet-btn {
    border: none; background: #0E7C66; color: #fff; padding: 10px 18px;
    border-radius: 10px; font-size: 14px; font-weight: 700;
  }

  .yukleniyor {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    color: #64748B; font-weight: 600; animation: nabiz 1.2s ease-in-out infinite;
  }
  @keyframes nabiz { 0%,100%{opacity:.4} 50%{opacity:1} }

  @media (max-width: 720px) { .sadece-masaustu { display: none !important; } }
  @media (min-width: 721px) { .sadece-mobil { display: none !important; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<!-- ============ YÜKLENİYOR ============ -->
<div id="yukleme" class="yukleniyor">Yükleniyor…</div>

<!-- ============ GİRİŞ EKRANI ============ -->
<div id="giris" class="giris-sayfa gizli">
  <div class="giris-kart">
    <div class="giris-eyebrow">Görev Merkezi</div>
    <h1 class="giris-baslik" id="giris-baslik">Giriş yap</h1>
    <div class="giris-alt" id="giris-alt">Görevleriniz tüm cihazlarınızda senkronize olur.</div>

    <label class="form-etiket" for="giris-eposta">E-posta</label>
    <input class="girdi" id="giris-eposta" type="email" autocomplete="email" placeholder="ornek@eposta.com" />

    <label class="form-etiket" for="giris-sifre">Şifre</label>
    <input class="girdi" id="giris-sifre" type="password" autocomplete="current-password" placeholder="••••••••" />

    <div id="giris-hata" class="hata-kutu gizli"></div>
    <div id="giris-bilgi" class="bilgi-kutu gizli"></div>

    <button class="btn-ana" id="giris-btn">Giriş yap</button>
    <button class="btn-link" id="mod-degistir">Hesabınız yok mu? Kayıt olun</button>
    <button class="btn-link" id="sifre-sifirla">Şifremi unuttum</button>
  </div>
</div>

<!-- ============ UYGULAMA ============ -->
<div id="app" class="app gizli">
  <header class="ust">
    <div class="ust-ic">
      <div>
        <div class="eyebrow" id="tarih-yazi"></div>
        <h1 class="baslik">Görev Merkezi</h1>
      </div>
      <div class="ust-sag">
        <span class="rozet r-yesil" id="durum-rozet">● Bağlı</span>
        <nav class="sekmeler sadece-masaustu">
          <button class="sekme-btn aktif" id="sekme-gorevler-btn">Görevler <span class="sayac-mini gizli" id="aktif-sayac"></span></button>
          <button class="sekme-btn" id="sekme-takvim-btn">Takvim</button>
          <button class="sekme-btn" id="sekme-ajanda-btn">Ajanda</button>
          <button class="sekme-btn" id="sekme-rapor-btn">Rapor</button>
          <button class="sekme-btn" id="sekme-bildirim-btn">🔔 <span class="rozet-sayi gizli" id="rozet-masaustu"></span></button>
        </nav>
        <button class="cikis-btn" id="cikis-btn">Çıkış</button>
      </div>
    </div>
  </header>

  <main class="icerik">
    <!-- görevler sayfası -->
    <section id="sayfa-gorevler">
      <div class="arac">
        <div class="filtre-grup" id="filtre-grup">
          <button class="filtre-btn aktif" data-filtre="aktif">Aktif</button>
          <button class="filtre-btn" data-filtre="tamamlanan">Tamamlanan</button>
          <button class="filtre-btn" data-filtre="tumu">Tümü</button>
        </div>
        <button class="yeni-btn sadece-masaustu" id="yeni-btn">+ Yeni görev</button>
      </div>
      <div class="kat-satir" id="kat-satir"></div>
      <div id="gorev-alani"></div>
    </section>

    <!-- rapor sayfası -->
    <section id="sayfa-rapor" class="gizli">
      <div class="rapor-ust">
        <div class="halka-kart"><svg id="halka" width="140" height="140" viewBox="0 0 140 140" role="img"></svg></div>
        <div class="stat-grup" id="stat-grup"></div>
      </div>
      <div class="panel">
        <div class="periyot-satir" id="periyot-satir">
          <button class="periyot-btn" data-periyot="gunluk">Günlük</button>
          <button class="periyot-btn aktif" data-periyot="haftalik">Haftalık</button>
          <button class="periyot-btn" data-periyot="aylik">Aylık</button>

<script type="module">
/* =====================================================================
   1) FIREBASE AYARLARI — BURAYI KENDİ BİLGİLERİNİZLE DEĞİŞTİRİN
   Firebase Console → Proje Ayarları → Genel → "Web uygulaması" bölümünden
   firebaseConfig nesnesini kopyalayıp aşağıya yapıştırın.
   ===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyD9YCRG6KdtjoRk2wwgLOkaXQcIbesQHo4",
  authDomain: "gorev-merkezi.firebaseapp.com",
  databaseURL: "https://gorev-merkezi-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "gorev-merkezi",
  storageBucket: "gorev-merkezi.firebasestorage.app",
  messagingSenderId: "399079252844",
  appId: "1:399079252844:web:e72bd63e285024f2708949"
};
/* ===================================================================== */

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword,
  createUserWithEmailAndPassword, sendPasswordResetEmail, signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getDatabase, ref, onValue, set
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

/* ---------- sabitler ---------- */
const KATEGORILER = [
  { id: "carena-group", ad: "Carena Group", renk: "#0E7C66" },
  { id: "carenaparts", ad: "Carenaparts", renk: "#4C6FFF" },
  { id: "otobakimevi", ad: "OtoBakımEvi", renk: "#B45309" },
  { id: "enacore", ad: "Enacore", renk: "#BE185D" },
  { id: "kisisel", ad: "Kişisel", renk: "#64748B" },
];
const ONCELIKLER = [
  { id: "yuksek", ad: "Yüksek", renk: "#DC2626" },
  { id: "orta", ad: "Orta", renk: "#D97706" },
  { id: "dusuk", ad: "Düşük", renk: "#64748B" },
];
const GUNLER = ["Paz","Pzt","Sal","Çar","Per","Cum","Cmt"];
const AYLAR = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const PERIYOTLAR = {
  gunluk: "Bugün — saat dilimlerine göre",
  haftalik: "Son 7 gün",
  aylik: "Son 4 hafta",
  yillik: "Son 12 ay",
};

/* ---------- durum ---------- */
let gorevler = [];
let notlar = [];
let filtre = "aktif";
let katFiltre = "tumu";
let sekme = "gorevler";
let periyot = "haftalik";
let duzenlenenId = null;
let kullanici = null;
let verilerYuklendi = false;
let takvimTarih = new Date();
let seciliGun = null;
let onTanimliTarih = null;
let ajandaTarih = bugunISO();

/* ---------- yardımcılar ---------- */
const $ = (id) => document.getElementById(id);
function bugunISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function tarihGoster(iso) {
  if (!iso) return "";
  const [y,m,g] = iso.split("-").map(Number);
  return `${g} ${AYLAR[m-1]}`;
}
const kategoriBul = (id) => KATEGORILER.find(k=>k.id===id) || KATEGORILER[4];
const oncelikBul = (id) => ONCELIKLER.find(o=>o.id===id) || ONCELIKLER[1];
function kacHtml(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function hataMesaji(kod) {
  const h = {
    "auth/invalid-email": "Geçersiz e-posta adresi.",
    "auth/user-not-found": "Bu e-posta ile kayıtlı hesap bulunamadı.",
    "auth/wrong-password": "Şifre hatalı.",
    "auth/invalid-credential": "E-posta veya şifre hatalı.",
    "auth/email-already-in-use": "Bu e-posta zaten kayıtlı. Giriş yapmayı deneyin.",
    "auth/weak-password": "Şifre en az 6 karakter olmalı.",
    "auth/too-many-requests": "Çok fazla deneme yapıldı. Lütfen biraz bekleyin.",
    "auth/network-request-failed": "Ağ hatası. İnternet bağlantınızı kontrol edin.",
  };
  return h[kod] || "Bir hata oluştu. Lütfen tekrar deneyin. (" + kod + ")";
}

/* ---------- giriş ekranı ---------- */
let kayitModu = false;
function girisHataGoster(msj) {
  const e = $("giris-hata"); e.textContent = msj; e.classList.remove("gizli");
  $("giris-bilgi").classList.add("gizli");
}
function girisBilgiGoster(msj) {
  const e = $("giris-bilgi"); e.textContent = msj; e.classList.remove("gizli");
  $("giris-hata").classList.add("gizli");
}
function girisTemizle() {
  $("giris-hata").classList.add("gizli");
  $("giris-bilgi").classList.add("gizli");
}

$("mod-degistir").addEventListener("click", () => {
  kayitModu = !kayitModu;
  girisTemizle();
  $("giris-baslik").textContent = kayitModu ? "Kayıt ol" : "Giriş yap";
  $("giris-btn").textContent = kayitModu ? "Hesap oluştur" : "Giriş yap";
  $("mod-degistir").textContent = kayitModu ? "Zaten hesabınız var mı? Giriş yapın" : "Hesabınız yok mu? Kayıt olun";
  $("giris-alt").textContent = kayitModu
    ? "Bir kez kayıt olun, tüm cihazlarınızdan aynı hesapla girin."
    : "Görevleriniz tüm cihazlarınızda senkronize olur.";
});

$("giris-btn").addEventListener("click", async () => {
  girisTemizle();
  const eposta = $("giris-eposta").value.trim();
  const sifre = $("giris-sifre").value;
  if (!eposta || !sifre) { girisHataGoster("E-posta ve şifre girin."); return; }
  $("giris-btn").disabled = true;
  try {
    if (kayitModu) await createUserWithEmailAndPassword(auth, eposta, sifre);
    else await signInWithEmailAndPassword(auth, eposta, sifre);
  } catch (err) {
    girisHataGoster(hataMesaji(err.code));
  } finally {
    $("giris-btn").disabled = false;
  }
});
$("giris-sifre").addEventListener("keydown", (e) => { if (e.key === "Enter") $("giris-btn").click(); });

$("sifre-sifirla").addEventListener("click", async () => {
  girisTemizle();
  const eposta = $("giris-eposta").value.trim();
  if (!eposta) { girisHataGoster("Önce e-posta adresinizi yazın."); return; }
  try {
    await sendPasswordResetEmail(auth, eposta);
    girisBilgiGoster("Şifre sıfırlama bağlantısı e-postanıza gönderildi.");
  } catch (err) {
    girisHataGoster(hataMesaji(err.code));
  }
});

$("cikis-btn").addEventListener("click", () => signOut(auth));

/* ---------- oturum ve veri senkronu ---------- */
let veriDinleyiciKapat = null;

onAuthStateChanged(auth, (u) => {
  kullanici = u;
  if (veriDinleyiciKapat) { veriDinleyiciKapat(); veriDinleyiciKapat = null; }
  if (u) {
    $("giris").classList.add("gizli");
    $("yukleme").classList.remove("gizli");
    $("yukleme").textContent = "Görevleriniz yükleniyor…";
    verilerYuklendi = false;
    const veriRef = ref(db, `users/${u.uid}/gorevler`);
    const gorevDinleyici = onValue(veriRef, (snap) => {
      const v = snap.val();
      gorevler = Array.isArray(v) ? v.filter(Boolean) : (v ? Object.values(v) : []);
      verilerYuklendi = true;
      $("yukleme").classList.add("gizli");
      $("app").classList.remove("gizli");
      durumRozet("bagli");
      tumunuCiz();
    }, (err) => {
      $("yukleme").classList.add("gizli");
      $("app").classList.remove("gizli");
      durumRozet("hata");
      console.error(err);
    });
    const notRef = ref(db, `users/${u.uid}/notlar`);
    const notDinleyici = onValue(notRef, (snap) => {
      const v = snap.val();
      notlar = Array.isArray(v) ? v.filter(Boolean) : (v ? Object.values(v) : []);
      if (sekme === "ajanda") ajandaCiz();
      if (sekme === "takvim") takvimCiz();
    }, (err) => console.error(err));
    veriDinleyiciKapat = () => { gorevDinleyici(); notDinleyici(); };
  } else {
    gorevler = [];
    notlar = [];
    $("yukleme").classList.add("gizli");
    $("app").classList.add("gizli");
    $("giris").classList.remove("gizli");
  }
});

async function kaydet() {
  if (!kullanici) return;
  durumRozet("kaydediliyor");
  try {
    await set(ref(db, `users/${kullanici.uid}/gorevler`), gorevler);
    durumRozet("bagli");
  } catch (e) {
    durumRozet("hata");
  }
}

async function notKaydet() {
  if (!kullanici) return;
  durumRozet("kaydediliyor");
  try {
    await set(ref(db, `users/${kullanici.uid}/notlar`), notlar);
    durumRozet("bagli");
  } catch (e) {
    durumRozet("hata");
  }
}

function durumRozet(d) {
  const r = $("durum-rozet");
  r.className = "rozet";
  if (d === "bagli") { r.classList.add("r-yesil"); r.textContent = "● Senkronize"; }
  else if (d === "kaydediliyor") { r.classList.add("r-sari"); r.textContent = "● Kaydediliyor…"; }
  else { r.classList.add("r-kirmizi"); r.textContent = "● Bağlantı hatası"; }
}

/* ---------- görev işlemleri ---------- */
function gorevEkleGuncelle(veri) {
  if (duzenlenenId) {
    gorevler = gorevler.map(g => g.id === duzenlenenId ? { ...g, ...veri } : g);
  } else {
    gorevler = [{
      ...veri,
      id: "g" + Date.now().toString(36) + Math.random().toString(36).slice(2,6),
      done: false, createdAt: Date.now(), completedAt: null,
    }, ...gorevler];
  }
  kaydet(); tumunuCiz(); formKapat();
}
function tamamlaToggle(id) {
  gorevler = gorevler.map(g => g.id === id
    ? { ...g, done: !g.done, completedAt: !g.done ? Date.now() : null } : g);
  kaydet(); tumunuCiz();
}
function sil(id) {
  gorevler = gorevler.filter(g => g.id !== id);
  kaydet(); tumunuCiz();
}

/* ---------- çizim: görev listesi ---------- */
function gorunenListe() {
  let l = gorevler;
  if (filtre === "aktif") l = l.filter(g => !g.done);
  if (filtre === "tamamlanan") l = l.filter(g => g.done);
  if (katFiltre !== "tumu") l = l.filter(g => g.kategori === katFiltre);
  const sira = { yuksek: 0, orta: 1, dusuk: 2 };
  return [...l].sort((a,b) => {
    if (a.done !== b.done) return a.done ? 1 : -1;
    if (a.dueDate && b.dueDate && a.dueDate !== b.dueDate) return a.dueDate < b.dueDate ? -1 : 1;
    if (a.dueDate && !b.dueDate) return -1;
    if (!a.dueDate && b.dueDate) return 1;
    return sira[a.oncelik] - sira[b.oncelik];
  });
}

function gorevleriCiz() {
  const alan = $("gorev-alani");
  const liste = gorunenListe();
  const bugun = bugunISO();

  const aktifSayi = gorevler.filter(g=>!g.done).length;
  const sayac = $("aktif-sayac");
  if (aktifSayi > 0) { sayac.textContent = aktifSayi; sayac.classList.remove("gizli"); }
  else sayac.classList.add("gizli");

  if (liste.length === 0) {
    alan.innerHTML = `
      <div class="bos">
        <div class="bos-ikon">◎</div>
        <div class="bos-baslik">${gorevler.length === 0 ? "Henüz görev yok" : "Bu filtrede görev yok"}</div>
        <div class="bos-alt">${gorevler.length === 0 ? "İlk görevinizi ekleyerek başlayın." : "Filtreyi değiştirin veya yeni görev ekleyin."}</div>
        <button class="yeni-btn" style="margin-top:16px" data-eylem="yeni">+ Yeni görev</button>
      </div>`;
    return;
  }

  alan.innerHTML = `<ul class="liste">` + liste.map(g => {
    const kat = kategoriBul(g.kategori);
    const onc = oncelikBul(g.oncelik);
    const gecikti = g.dueDate && !g.done && g.dueDate < bugun;
    const bugunMu = g.dueDate === bugun && !g.done;
    let tarihEtiket = "";
    if (g.dueDate) {
      const renk = gecikti ? "#DC2626" : bugunMu ? "#0E7C66" : "#64748B";
      const kalin = (gecikti || bugunMu) ? "font-weight:700;" : "";
      const onek = gecikti ? "Gecikti · " : bugunMu ? "Bugün · " : "";
      tarihEtiket = `<span class="etiket" style="color:${renk};border-color:${renk}55;${kalin}">${onek}${tarihGoster(g.dueDate)}</span>`;
    }
    return `
    <li class="kart ${g.done ? "tamam" : ""} ${gecikti ? "gecikti" : ""}">
      <button class="kutu ${g.done ? "isaretli" : ""}" data-eylem="toggle" data-id="${g.id}"
        aria-label="${g.done ? "Tamamlanmadı olarak işaretle" : "Tamamlandı olarak işaretle"}">${g.done ? "✓" : ""}</button>
      <div class="kart-govde">
        <div class="kart-baslik ${g.done ? "ustu-cizili" : ""}">
          ${g.oncelik === "yuksek" && !g.done ? '<span class="unlem" title="Yüksek öncelik">!</span>' : ""}${kacHtml(g.baslik)}
        </div>
        ${gecikti ? `<div class="gecikme-uyari" role="alert">⚠ Bu görev gecikti — son tarih ${tarihGoster(g.dueDate)} idi.</div>` : ""}
        ${g.not ? `<div class="kart-not">${kacHtml(g.not)}</div>` : ""}
        <div class="kart-meta">
          <span class="etiket" style="color:${kat.renk};border-color:${kat.renk}55">${kat.ad}</span>
          <span class="etiket" style="color:${onc.renk};border-color:${onc.renk}55">${onc.ad}</span>
          ${tarihEtiket}
        </div>
      </div>
      <div class="kart-aksiyon">
        ${g.dueDate ? `<button class="ikon-btn" data-eylem="ics" data-id="${g.id}" title="Telefonun takvimine ekle (alarmıyla)" aria-label="Telefon takvimine ekle">📅</button>` : ""}
        <button class="ikon-btn" data-eylem="duzenle" data-id="${g.id}" aria-label="Düzenle">✎</button>
        <button class="ikon-btn" data-eylem="sil" data-id="${g.id}" aria-label="Sil">🗑</button>
      </div>
    </li>`;
  }).join("") + `</ul>`;
}

function eylemIsle(e) {
  const btn = e.target.closest("[data-eylem]");
  if (!btn) return;
  const { eylem, id } = btn.dataset;
  if (eylem === "toggle") tamamlaToggle(id);
  else if (eylem === "sil") sil(id);
  else if (eylem === "duzenle") formAc(id);
  else if (eylem === "yeni") formAc(null);
  else if (eylem === "ics") icsIndir(id);
  else if (eylem === "gun-yeni") formAc(null, seciliGun);
}
$("gorev-alani").addEventListener("click", eylemIsle);
$("takvim-gun-detay").addEventListener("click", eylemIsle);

/* ---------- çizim: kategori çipleri ---------- */
function katCiz() {
  const alan = $("kat-satir");
  let html = `<button class="kat-chip ${katFiltre==="tumu" ? "tumu-aktif" : ""}" data-kat="tumu">Tümü</button>`;
  for (const k of KATEGORILER) {
    const aktif = katFiltre === k.id;
    html += `<button class="kat-chip" data-kat="${k.id}"
      style="${aktif ? `background:${k.renk};border-color:${k.renk};color:#fff` : ""}">
      <span class="nokta" style="background:${aktif ? "#fff" : k.renk}"></span>${k.ad}</button>`;
  }
  alan.innerHTML = html;
}
$("kat-satir").addEventListener("click", (e) => {

const SAYFALAR = ["gorevler", "takvim", "ajanda", "rapor", "bildirim"];

/* ---------- rapor ---------- */
function grafikVerisi() {
  const GUN_MS = 86400000;
  const dilimler = [];
  if (periyot === "gunluk") {
    const gun = new Date(); gun.setHours(0,0,0,0);
    for (let i=0;i<8;i++) {
      const bas = gun.getTime() + i*3*3600000;
      dilimler.push({ ad: `${String(i*3).padStart(2,"0")}–${String(i*3+3).padStart(2,"0")}`, bas, bit: bas+3*3600000 });
    }
  } else if (periyot === "haftalik") {
    for (let i=6;i>=0;i--) {
      const d = new Date(); d.setDate(d.getDate()-i); d.setHours(0,0,0,0);
      dilimler.push({ ad: GUNLER[d.getDay()], bas: d.getTime(), bit: d.getTime()+GUN_MS });
    }
  } else if (periyot === "aylik") {
    const yarin = new Date(); yarin.setHours(0,0,0,0);
    const bitis = yarin.getTime() + GUN_MS;
    for (let i=3;i>=0;i--) {
      const bit = bitis - i*7*GUN_MS;
      const bas = bit - 7*GUN_MS;
      const bd = new Date(bas);
      dilimler.push({ ad: `${bd.getDate()} ${AYLAR[bd.getMonth()].slice(0,3)}`, bas, bit });
    }
  } else {
    const simdi = new Date();
    for (let i=11;i>=0;i--) {
      const bas = new Date(simdi.getFullYear(), simdi.getMonth()-i, 1);
      const bit = new Date(simdi.getFullYear(), simdi.getMonth()-i+1, 1);
      dilimler.push({ ad: AYLAR[bas.getMonth()].slice(0,3), bas: bas.getTime(), bit: bit.getTime() });
    }
  }
  return dilimler.map(d => ({ ...d,
    sayi: gorevler.filter(g => g.completedAt && g.completedAt >= d.bas && g.completedAt < d.bit).length }));
}

function raporCiz() {
  const toplam = gorevler.length;
  const tamam = gorevler.filter(g=>g.done).length;
  const oran = toplam ? Math.round(tamam/toplam*100) : 0;
  const bugun = bugunISO();
  const geciken = gorevler.filter(g => !g.done && g.dueDate && g.dueDate < bugun).length;

  /* halka */
  const R = 52, C = 2*Math.PI*R;
  $("halka").setAttribute("aria-label", `Tamamlanma oranı yüzde ${oran}`);
  $("halka").innerHTML = `
    <circle cx="70" cy="70" r="${R}" fill="none" stroke="#E2E8F0" stroke-width="12"/>
    <circle cx="70" cy="70" r="${R}" fill="none" stroke="#0E7C66" stroke-width="12"
      stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-oran/100)}"
      transform="rotate(-90 70 70)" style="transition:stroke-dashoffset .8s ease"/>
    <text x="70" y="66" text-anchor="middle" font-size="26" font-weight="800" fill="#0E1B2C">${oran}%</text>
    <text x="70" y="86" text-anchor="middle" font-size="11" fill="#64748B">tamamlandı</text>`;

  /* stat kartları */
  const statlar = [
    [toplam, "Toplam görev", "#0E1B2C"],
    [tamam, "Tamamlanan", "#0E7C66"],
    [toplam - tamam, "Bekleyen", "#D97706"],
    [geciken, "Geciken", geciken > 0 ? "#DC2626" : "#64748B"],
  ];
  $("stat-grup").innerHTML = statlar.map(([d, ad, renk]) =>
    `<div class="stat-kart"><div class="stat-deger" style="color:${renk}">${d}</div><div class="stat-ad">${ad}</div></div>`
  ).join("");

  /* grafik */
  const grafik = grafikVerisi();
  const max = Math.max(1, ...grafik.map(g=>g.sayi));
  const pToplam = grafik.reduce((a,b)=>a+b.sayi,0);
  $("grafik-baslik").textContent = PERIYOTLAR[periyot];
  $("grafik-toplam").textContent = `${pToplam} görev tamamlandı`;
  $("cubuk-alan").innerHTML = grafik.map((g,i) => `
    <div class="cubuk-kolon">
      <div class="cubuk-deger">${g.sayi > 0 ? g.sayi : ""}</div>
      <div class="cubuk ${i === grafik.length-1 ? "son" : ""}" style="height:${Math.max(6, g.sayi/max*100)}%"></div>
      <div class="cubuk-ad ${grafik.length > 8 ? "kucuk" : ""}">${g.ad}</div>
    </div>`).join("");

  /* kategori dağılımı */
  const katVeri = KATEGORILER.map(k => {
    const kl = gorevler.filter(g => g.kategori === k.id);
    return { ...k, toplam: kl.length, tamam: kl.filter(g=>g.done).length };
  }).filter(k => k.toplam > 0);
  $("kat-rapor").innerHTML = katVeri.length === 0
    ? `<div style="color:#64748B;font-size:14px">Henüz veri yok.</div>`
    : katVeri.map(k => `
      <div class="kat-rapor-satir">
        <span class="kat-rapor-ad"><span class="nokta" style="background:${k.renk}"></span>${k.ad}</span>
        <span class="kat-rapor-sayi">${k.tamam}/${k.toplam}</span>
      </div>
      <div class="ilerle-arka"><div class="ilerle-dolgu" style="width:${k.toplam ? k.tamam/k.toplam*100 : 0}%;background:${k.renk}"></div></div>
    `).join("");
}

$("periyot-satir").addEventListener("click", (e) => {
  const btn = e.target.closest("[data-periyot]");

  periyot = btn.dataset.periyot;

/* ---------- takvim ---------- */
function isoYap(t) {
  return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`;
}

function takvimCiz() {
  const yil = takvimTarih.getFullYear(), ay = takvimTarih.getMonth();
  $("takvim-baslik").textContent = `${AYLAR[ay]} ${yil}`;
  $("takvim-hafta").innerHTML = ["Pzt","Sal","Çar","Per","Cum","Cmt","Paz"].map(g=>`<div>${g}</div>`).join("");
  const kaydir = (new Date(yil, ay, 1).getDay() + 6) % 7;
  const gunSayisi = new Date(yil, ay + 1, 0).getDate();
  const toplamHucre = Math.ceil((kaydir + gunSayisi) / 7) * 7;
  const bugun = bugunISO();
  let html = "";
  for (let i = 0; i < toplamHucre; i++) {
    const t = new Date(yil, ay, i - kaydir + 1);
    const iso = isoYap(t);
    const baskaAy = t.getMonth() !== ay;
    const gunun = gorevler.filter(x => x.dueDate === iso);
    const notVar = notlar.some(n => n.tarih === iso);
    const noktalar = gunun.slice(0, 3).map(x =>
      `<span class="nokta" style="background:${x.done ? "#CBD5E1" : kategoriBul(x.kategori).renk}"></span>`).join("");
    const notIm = notVar ? `<span class="takvim-not-im">✎</span>` : "";
    const fazla = gunun.length > 3 ? `<span class="fazla">+${gunun.length - 3}</span>` : "";
    html += `<button class="takvim-gun ${baskaAy ? "baska-ay" : ""} ${iso === bugun ? "bugun" : ""} ${iso === seciliGun ? "secili" : ""}" data-gun="${iso}">
      <span>${t.getDate()}</span><span class="takvim-noktalar">${noktalar}${notIm}${fazla}</span></button>`;
  }
  $("takvim-grid").innerHTML = html;
  gunDetayCiz();
}

function gunDetayCiz() {
  const alan = $("takvim-gun-detay");
  if (!seciliGun) { alan.innerHTML = ""; return; }
  const gunun = gorevler.filter(g => g.dueDate === seciliGun)
    .sort((a,b) => (a.done - b.done) || ((a.hatirlatma||"99") < (b.hatirlatma||"99") ? -1 : 1));
  const baslik = tarihGoster(seciliGun);
  let html = `<div class="panel"><div class="panel-baslik"><span>${baslik}</span>
    <button class="yeni-btn" data-eylem="gun-yeni" style="padding:7px 14px;font-size:13px">+ Bu güne görev ekle</button></div>`;
  if (gunun.length === 0) {
    html += `<div style="color:#64748B;font-size:14px">Bu günde görev yok.</div>`;
  } else {
    html += `<ul class="liste">` + gunun.map(g => {
      const kat = kategoriBul(g.kategori);
      return `<li class="kart ${g.done ? "tamam" : ""}">
        <button class="kutu ${g.done ? "isaretli" : ""}" data-eylem="toggle" data-id="${g.id}"
          aria-label="Tamamlandı işareti">${g.done ? "✓" : ""}</button>
        <div class="kart-govde">
          <div class="kart-baslik ${g.done ? "ustu-cizili" : ""}">${g.oncelik === "yuksek" && !g.done ? '<span class="unlem">!</span>' : ""}${kacHtml(g.baslik)}</div>
          <div class="kart-meta">
            <span class="etiket" style="color:${kat.renk};border-color:${kat.renk}55">${kat.ad}</span>
            ${g.hatirlatma ? `<span class="etiket" style="color:#0E7C66;border-color:#0E7C6655">⏰ ${g.hatirlatma}</span>` : ""}
          </div>
        </div>
        <div class="kart-aksiyon">
          <button class="ikon-btn" data-eylem="ics" data-id="${g.id}" title="Telefonun takvimine ekle" aria-label="Takvime ekle">📅</button>
          <button class="ikon-btn" data-eylem="duzenle" data-id="${g.id}" aria-label="Düzenle">✎</button>
          <button class="ikon-btn" data-eylem="sil" data-id="${g.id}" aria-label="Sil">🗑</button>
        </div>
      </li>`;
    }).join("") + `</ul>`;
  }
  const gununNotlari = notlar.filter(n => n.tarih === seciliGun);
  if (gununNotlari.length > 0) {
    html += `<div style="margin-top:14px;font-weight:800;font-size:13px;color:#475569">✎ Ajanda notları</div>`;
    html += gununNotlari.map(n => `<div class="not-kart bilgi" style="margin-top:8px"><div class="not-metin">${kacHtml(n.metin)}</div>${n.saat ? `<div class="not-alt-satir"><span class="not-saat">⏰ ${n.saat}</span></div>` : ""}</div>`).join("");
  }
  html += `<div style="margin-top:12px"><button class="iptal-btn" id="detaydan-ajanda">Bu günün ajandasını aç →</button></div>`;
  alan.innerHTML = html + `</div>`;
  const gecis = $("detaydan-ajanda");
  if (gecis) gecis.addEventListener("click", () => { ajandaTarih = seciliGun; sekmeDegistir("ajanda"); });
}

  const btn = e.target.closest("[data-gun]");
  if (!btn) return;
  seciliGun = seciliGun === btn.dataset.gun ? null : btn.dataset.gun;
  takvimCiz();

/* ---------- bildirim merkezi ---------- */
function bildirimUret() {
  const bugun = bugunISO();
  const simdi = Date.now();
  const liste = [];
  for (const g of gorevler) {
    const kat = kategoriBul(g.kategori).ad;
    if (!g.done && g.dueDate && g.dueDate < bugun)
      liste.push({ renk: "#DC2626", ikon: "⚠️", baslik: `Gecikti: ${g.baslik}`,
        alt: `Son tarih ${tarihGoster(g.dueDate)} idi · ${kat}`, sira: 0, ts: 0 });
    if (!g.done && g.dueDate === bugun)
      liste.push({ renk: "#D97706", ikon: "⏰", baslik: `Bugün: ${g.baslik}`,
        alt: (g.hatirlatma ? `Hatırlatma saati ${g.hatirlatma}` : "Bugün tamamlanmalı") + ` · ${kat}`, sira: 1, ts: 0 });
    if (g.done && g.completedAt && simdi - g.completedAt < 7 * 86400000)
      liste.push({ renk: "#0E7C66", ikon: "✅", baslik: `Tamamlandı: ${g.baslik}`,
        alt: `${new Date(g.completedAt).toLocaleDateString("tr-TR")} · ${kat}`, sira: 2, ts: g.completedAt });
  }
  return liste.sort((a, b) => a.sira - b.sira || b.ts - a.ts);
}

function bildirimCiz() {
  const liste = bildirimUret();
  $("bildirim-listesi").innerHTML = liste.length === 0
    ? `<div class="bos"><div class="bos-ikon">🔕</div><div class="bos-baslik">Bildirim yok</div>
       <div class="bos-alt">Geciken, bugüne ait veya son 7 günde tamamlanan görevler burada listelenir.</div></div>`
    : liste.map(b => `
      <div class="bildirim-kart" style="border-left-color:${b.renk}">
        <div class="bildirim-ikon">${b.ikon}</div>
        <div><div class="bildirim-baslik">${kacHtml(b.baslik)}</div><div class="bildirim-alt">${kacHtml(b.alt)}</div></div>
      </div>`).join("");
}

function rozetGuncelle() {
  const bugun = bugunISO();
  const n = gorevler.filter(g => !g.done && g.dueDate && g.dueDate <= bugun).length;
  for (const id of ["rozet-masaustu", "rozet-mobil"]) {
    const e = $(id); if (!e) continue;
    if (n > 0) { e.textContent = n; e.classList.remove("gizli"); }
    else e.classList.add("gizli");
  }
}

/* ---------- sistem bildirimi izni ---------- */
function izinDurumYaz() {
  const y = $("izin-yazi"), b = $("izin-btn");
  if (!("Notification" in window)) {
    y.textContent = "Bu tarayıcı sistem bildirimlerini desteklemiyor. iPhone kullanıyorsanız: siteyi Safari'de açıp Paylaş → Ana Ekrana Ekle deyin ve uygulamayı oradan açın; bildirimler o zaman çalışır. Alternatif olarak görevlerin yanındaki 📅 butonuyla görevi telefonunuzun takvimine ekleyin — takvim alarmı her durumda çalar.";
    b.classList.add("gizli"); return;
  }
  if (Notification.permission === "granted") {
    y.textContent = "✅ Bildirim izni verildi. Uygulama açıkken, hatırlatma saati gelen görevler için ekrana sistem bildirimi düşer ve alarm sesi çalar. Not: uygulama ve tarayıcı tamamen kapalıyken bildirim gönderilemez — bu durumda görevin yanındaki 📅 butonuyla telefonunuzun takvimine ekleyin, takvim alarmı her koşulda çalar.";
    b.classList.add("gizli");
  } else if (Notification.permission === "denied") {
    y.textContent = "Bildirim izni daha önce reddedilmiş. Tarayıcınızın site ayarlarından bu adres için bildirimlere izin verirseniz hatırlatmalar çalışır.";
    b.classList.add("gizli");
  } else {
    y.textContent = "Hatırlatma saatinde ekranınıza bildirim düşmesi ve alarm çalması için izin verin. (Bildirimler uygulama açıkken çalışır; kapalıyken 📅 butonuyla telefon takvimine eklemek en garantili yoldur.)";
    b.classList.remove("gizli");
  }
}
$("izin-btn").addEventListener("click", async () => {
  try { await Notification.requestPermission(); } catch (e) {}
  izinDurumYaz();
});

/* ---------- alarm sesi ---------- */
function alarmCal() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const notalar = [880, 0, 880, 0, 880, 0, 1174, 1174];
    let t = ctx.currentTime + 0.05;
    for (const f of notalar) {
      if (f) {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = "sine"; o.frequency.value = f;
        g.gain.setValueAtTime(0.001, t);
        g.gain.exponentialRampToValueAtTime(0.35, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
        o.connect(g); g.connect(ctx.destination);
        o.start(t); o.stop(t + 0.25);
      }
      t += 0.28;
    }
  } catch (e) {}
}

/* ---------- hatırlatma motoru ---------- */
function bannerGoster(saat, metin) {
  const eski = document.getElementById("hatirlatma-banner");
  if (eski) eski.remove();
  const d = document.createElement("div");
  d.className = "banner"; d.id = "hatirlatma-banner";
  d.innerHTML = `<span style="font-size:22px">⏰</span><div><b>${saat}</b> — ${kacHtml(metin)}</div>`;
  const btn = document.createElement("button");
  btn.textContent = "Tamam";
  btn.addEventListener("click", () => d.remove());
  d.appendChild(btn);
  document.body.appendChild(d);
  setTimeout(() => { if (document.getElementById("hatirlatma-banner") === d) d.remove(); }, 60000);
}

function hatirlat(saat, metin) {
  bannerGoster(saat, metin);
  alarmCal();
  if ("Notification" in window && Notification.permission === "granted") {
    try {
      new Notification("⏰ Görev Merkezi — Hatırlatma", { body: `${saat} · ${metin}` });
    } catch (e) {}
  }
}

function hatirlatmaKontrol() {
  if (!verilerYuklendi || !kullanici) return;
  const bugun = bugunISO();
  const s = new Date();
  const saatSimdi = `${String(s.getHours()).padStart(2,"0")}:${String(s.getMinutes()).padStart(2,"0")}`;
  let gDegisti = false, nDegisti = false;
  for (const g of gorevler) {
    if (g.done || !g.dueDate || !g.hatirlatma || g.remindedAt) continue;
    if (g.dueDate === bugun && saatSimdi >= g.hatirlatma) {
      g.remindedAt = Date.now(); gDegisti = true; hatirlat(g.hatirlatma, g.baslik);
    }
  }
  for (const n of notlar) {
    if (!n.saat || n.remindedAt) continue;
    if (n.tarih === bugun && saatSimdi >= n.saat) {
      n.remindedAt = Date.now(); nDegisti = true; hatirlat(n.saat, n.metin);
    }
  }
  if (gDegisti) { kaydet(); rozetGuncelle(); }
  if (nDegisti) notKaydet();
}
setInterval(hatirlatmaKontrol, 20000);

/* ---------- telefon takvimine aktarma (.ics) ---------- */
function icsTemizle(s) { return String(s).replace(/\\/g, " ").replace(/[;,]/g, " ").replace(/\n/g, " "); }
function icsYaz(uid, tarih, saat, baslik, aciklama) {
  const [y, m, gg] = tarih.split("-");
  let dtstart, dtend;
  if (saat) {
    const [hh, mm] = saat.split(":");
    dtstart = `DTSTART:${y}${m}${gg}T${hh}${mm}00`;
    const bit = new Date(+y, +m - 1, +gg, +hh, +mm + 30);
    dtend = `DTEND:${bit.getFullYear()}${String(bit.getMonth()+1).padStart(2,"0")}${String(bit.getDate()).padStart(2,"0")}T${String(bit.getHours()).padStart(2,"0")}${String(bit.getMinutes()).padStart(2,"0")}00`;
  } else {
    dtstart = `DTSTART;VALUE=DATE:${y}${m}${gg}`;
    dtend = `DTEND;VALUE=DATE:${y}${m}${gg}`;
  }
  const ics = [
    "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//GorevMerkezi//TR", "BEGIN:VEVENT",
    `UID:${uid}@gorevmerkezi`, dtstart, dtend,
    `SUMMARY:${icsTemizle(baslik)}`,
    aciklama ? `DESCRIPTION:${icsTemizle(aciklama)}` : "",
    "BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${icsTemizle(baslik)}`, "TRIGGER:-PT0M", "END:VALARM",
    "END:VEVENT", "END:VCALENDAR",
  ].filter(Boolean).join("\r\n");
  const blob = new Blob([ics], { type: "text/calendar;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "hatirlatma.ics";
  document.body.appendChild(a);
  a.click();
  a.remove();
}
function icsIndir(id) {
  const g = gorevler.find(x => x.id === id);
  if (!g || !g.dueDate) return;
  icsYaz(g.id, g.dueDate, g.hatirlatma, g.baslik, g.not);
}
function icsIndirNot(id) {
  const n = notlar.find(x => x.id === id);
  if (!n) return;
  icsYaz(n.id, n.tarih, n.saat, n.metin.slice(0, 60), n.metin);
}

/* ============================================================
   AJANDA (gün gün notlar)
   ============================================================ */
function kaydirGun(iso, adet) {
  const [y,m,g] = iso.split("-").map(Number);
  return isoYap(new Date(y, m-1, g + adet));
}
function ajandaCiz() {
  const t = ajandaTarih;
  $("ajanda-tarih").value = t;
  const [y,m,g] = t.split("-").map(Number);
  const d = new Date(y, m-1, g);
  const bugun = bugunISO();
  const gunAdlari = ["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
  $("ajanda-gun-baslik").textContent = `${g} ${AYLAR[m-1]} ${y}`;
  $("ajanda-gun-alt").textContent = gunAdlari[d.getDay()] + (t === bugun ? " · Bugün" : "");

  const gunGorev = gorevler.filter(x => x.dueDate === t);
  const gunNot = notlar.filter(n => n.tarih === t);
  const bekleyen = gunGorev.filter(x => !x.done).length;
  $("ajanda-ozet").innerHTML = `
    <div class="ozet-kutu"><div class="ozet-deger" style="color:#0E7C66">${gunGorev.length}</div><div class="ozet-ad">Görev</div></div>
    <div class="ozet-kutu"><div class="ozet-deger" style="color:#D97706">${bekleyen}</div><div class="ozet-ad">Bekleyen</div></div>
    <div class="ozet-kutu"><div class="ozet-deger" style="color:#4C6FFF">${gunNot.length}</div><div class="ozet-ad">Not</div></div>`;

  const ogeler = [];
  for (const x of gunGorev) ogeler.push({ tip: "gorev", saat: x.hatirlatma || "", g: x });
  for (const n of gunNot) ogeler.push({ tip: "not", saat: n.saat || "", n });
  ogeler.sort((a,b) => {
    const sa = a.saat || "99:99", sb = b.saat || "99:99";
    return sa < sb ? -1 : sa > sb ? 1 : 0;
  });

  $("ajanda-sayi").textContent = ogeler.length ? `${ogeler.length} kayıt` : "";
  if (ogeler.length === 0) {
    $("ajanda-liste").innerHTML = `<div style="color:#64748B;font-size:14px;padding:8px 0">Bu gün için henüz görev veya not yok. Yukarıdan not ekleyebilirsin.</div>`;
    return;
  }
  $("ajanda-liste").innerHTML = ogeler.map(o => {
    if (o.tip === "gorev") {
      const kat = kategoriBul(o.g.kategori);
      return `<div class="not-kart bilgi">
        <div class="not-metin"><b>📋 ${kacHtml(o.g.baslik)}</b>${o.g.done ? " ✓" : ""}${o.g.not ? "\n" + kacHtml(o.g.not) : ""}</div>
        <div class="not-alt-satir">
          <span class="not-saat">${o.saat ? "⏰ " + o.saat + " · " : ""}<span style="color:${kat.renk}">${kat.ad}</span></span>
        </div></div>`;
    } else {
      return `<div class="not-kart">
        <div class="not-metin">${kacHtml(o.n.metin)}</div>
        <div class="not-alt-satir">
          <span class="not-saat">${o.saat ? "⏰ " + o.saat : "✎ Not"}</span>
          <span class="not-aksiyon">
            <button class="ikon-btn" data-not-eylem="ics" data-not-id="${o.n.id}" title="Takvime ekle" aria-label="Takvime ekle">📅</button>
            <button class="ikon-btn" data-not-eylem="sil" data-not-id="${o.n.id}" aria-label="Notu sil">🗑</button>
          </span>
        </div></div>`;
    }
  }).join("");
}
function notEkle() {
  const metin = $("not-metin").value.trim();
  if (!metin) return;
  notlar = [{
    id: "n" + Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    tarih: ajandaTarih,
    metin,
    saat: $("not-saat").value || null,
    createdAt: Date.now(),
    remindedAt: null,
  }, ...notlar];
  $("not-metin").value = "";
  $("not-saat").value = "";
  notKaydet();
  ajandaCiz();
}
function notSil(id) {
  notlar = notlar.filter(n => n.id !== id);
  notKaydet();
  ajandaCiz();
}
$("not-ekle-btn").addEventListener("click", notEkle);
$("ajanda-liste").addEventListener("click", (e) => {
  const btn = e.target.closest("[data-not-eylem]");
  if (!btn) return;
  const { notEylem, notId } = btn.dataset;
  if (notEylem === "sil") notSil(notId);
  else if (notEylem === "ics") icsIndirNot(notId);
});
$("ajanda-tarih").addEventListener("change", (e) => { ajandaTarih = e.target.value || bugunISO(); ajandaCiz(); });
$("ajanda-geri").addEventListener("click", () => { ajandaTarih = kaydirGun(ajandaTarih, -1); ajandaCiz(); });
$("ajanda-ileri").addEventListener("click", () => { ajandaTarih = kaydirGun(ajandaTarih, 1); ajandaCiz(); });

/* ---------- form ---------- */
function formAc(id, onTarih) {
  duzenlenenId = id;
  const g = id ? gorevler.find(x=>x.id===id) : null;
  $("form-baslik-yazi").textContent = g ? "Görevi düzenle" : "Yeni görev";
  $("form-kaydet").textContent = g ? "Kaydet" : "Görevi ekle";
  $("f-baslik").value = g?.baslik || "";
  $("f-not").value = g?.not || "";
  $("f-kategori").value = g?.kategori || "carena-group";
  $("f-oncelik").value = g?.oncelik || "orta";
  $("f-tarih").value = g?.dueDate || onTarih || "";
  $("f-hatirlatma").value = g?.hatirlatma || "";
  $("f-hata").classList.add("gizli");
  $("perde").classList.remove("gizli");
  $("f-baslik").focus();
}
function formKapat() {
  $("perde").classList.add("gizli");
  duzenlenenId = null;
}
$("form-kapat").addEventListener("click", formKapat);
$("form-iptal").addEventListener("click", formKapat);
$("perde").addEventListener("click", (e) => { if (e.target === $("perde")) formKapat(); });
$("form-kaydet").addEventListener("click", () => {
  const baslik = $("f-baslik").value.trim();
  if (!baslik) { $("f-hata").classList.remove("gizli"); return; }
  gorevEkleGuncelle({
    baslik,
    not: $("f-not").value.trim(),
    kategori: $("f-kategori").value,
    oncelik: $("f-oncelik").value,
    dueDate: $("f-tarih").value || null,
    hatirlatma: $("f-hatirlatma").value || null,
    remindedAt: null,
  });
});
$("f-baslik").addEventListener("input", () => $("f-hata").classList.add("gizli"));
$("yeni-btn").addEventListener("click", () => formAc(null));
$("fab").addEventListener("click", () => { sekmeDegistir("gorevler"); formAc(null); });

/* ---------- başlangıç ---------- */
function tumunuCiz() {
  katCiz(); gorevleriCiz(); rozetGuncelle();
  if (sekme === "rapor") raporCiz();
  if (sekme === "takvim") takvimCiz();
  if (sekme === "ajanda") ajandaCiz();
  if (sekme === "bildirim") bildirimCiz();
}
(function () {
  const d = new Date();
  $("tarih-yazi").textContent = `${d.getDate()} ${AYLAR[d.getMonth()]}, ${GUNLER[d.getDay()]}`;
  const katSecim = $("f-kategori");
  katSecim.innerHTML = KATEGORILER.map(k=>`<option value="${k.id}">${k.ad}</option>`).join("");
  $("f-oncelik").innerHTML = ONCELIKLER.map(o=>`<option value="${o.id}">${o.ad}</option>`).join("");
  $("ajanda-tarih").value = ajandaTarih;
})();
</script>
</body>
</html>
